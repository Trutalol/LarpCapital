# Render Blueprint: LarpCapital frontend as a static site.
services:
  - type: web
    name: larpcapital
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_COURSE_URL
        value: https://larpmodel.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Parody course site (Larp Academy). Fake checkout, no payments.
  - type: web
    name: larpmodel
    runtime: static
    rootDir: course-site
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_LARPCAPITAL_URL
        value: https://larpcapital.onrender.com
